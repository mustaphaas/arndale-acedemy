name: Complete student portal check

on:
  push:
    branches:
      - feature/complete-student-portal

jobs:
  build-local:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck:local
      - run: pnpm test:local
      - run: pnpm build:local
